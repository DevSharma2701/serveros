# Render blueprint for the ServeOS API. In Render: New > Blueprint > pick this repository.
#
# Render asks you for the values marked "sync: false" when you create the service.
# Email and payment keys are deliberately not listed: add them later in the service's
# Environment tab (see docs/credentials.md). Until then email is off and guests pay at the counter.
services:
  - type: web
    name: serveos-api
    runtime: node
    # "free" is fine for a first trial, but it sleeps after 15 idle minutes and takes about a
    # minute to wake. Change to "starter" (always on) before real service: a till cannot wait.
    plan: free
    region: singapore
    # --prod=false keeps the build tools (Nest CLI, TypeScript) even though NODE_ENV is production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:shared && pnpm exec prisma generate && pnpm --filter @serveos/api build
    # Applies any new database migrations, then starts the server.
    startCommand: pnpm exec prisma migrate deploy && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: STORAGE_PROVIDER
        value: database
      - key: EMAIL_PROVIDER
        value: dev
      - key: PAYMENT_PROVIDER
        value: none
      - key: WEB_URL
        value: https://app.serveros.me
      - key: API_URL
        value: https://api.serveros.me
      - key: CORS_ORIGINS
        value: https://app.serveros.me
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The only two values you type in: the Neon connection strings.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
    # Listed here so a blueprint sync keeps the address that was added in the dashboard.
    domains:
      - api.serveros.me

  # ── Web app (POS, back office, guest QR page) and, under /kitchen/, the kitchen display ──
  # Both are static files on one free site that never sleeps. The kitchen display shares this
  # address because the free workspace allows only two custom domains (this one and the API).
  - type: web
    name: serveos-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:shared && pnpm --filter @serveos/web build && VITE_BASE=/kitchen/ pnpm --filter @serveos/kds build && cp -r apps/kds/dist apps/web/dist/kitchen
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    domains:
      - app.serveros.me
    envVars:
      - key: NODE_VERSION
        value: 22
      # Public addresses, baked into the page at build time. Never put a secret in a VITE_ value.
      - key: VITE_API_URL
        value: https://api.serveros.me
      - key: VITE_KDS_URL
        value: https://app.serveros.me/kitchen/
    routes:
      - type: rewrite
        source: /kitchen/*
        destination: /kitchen/index.html
      # A single-page app: any address that is not a real file (such as a table's QR link,
      # /t/<code>) must open the app, which then shows the right screen.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
