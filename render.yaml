# Render blueprint for the ServeOS API. In Render: New > Blueprint > pick this repository.
# Written from Render's documented format but not yet deployed; expect to adjust on first use.
#
# Every value marked "sync: false" is a secret or an address you type into Render's dashboard.
# See docs/credentials.md for what each one is and where to get it.
services:
  - type: web
    name: serveos-api
    runtime: node
    plan: starter # an always-on instance; the free plan sleeps, which a till cannot tolerate
    region: singapore
    # --prod=false keeps the build tools (Nest CLI, TypeScript) even though NODE_ENV is production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build:shared && pnpm exec prisma generate && pnpm --filter @serveos/api build
    # Applies any new database migrations, then starts the server.
    startCommand: pnpm exec prisma migrate deploy && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: STORAGE_PROVIDER
        value: database
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: dev # change to "resend" once EMAIL_API_KEY is set
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYMENT_PROVIDER
        value: none # change to "razorpay" once the three payment values below are set
      - key: PAYMENT_API_KEY
        sync: false
      - key: PAYMENT_API_SECRET
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
